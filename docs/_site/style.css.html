<style>
:root { --bg:#fbfbfd; --ink:#1d1d1f; --muted:#6e6e73; --card:#ffffff; --line:#e5e5ea; --accent:#0a66d6; --warn:#c77700; --ok:#1f8a3b; --bad:#c42b1c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#07070b; --ink:#f5f5f7; --muted:#a1a1aa; --card:#121219; --line:#26262f; --accent:#6aa8ff; --warn:#f0a541; --ok:#5fd17a; --bad:#ff5f57; } }
:root[data-theme="dark"] { --bg:#07070b; --ink:#f5f5f7; --muted:#a1a1aa; --card:#121219; --line:#26262f; --accent:#6aa8ff; --warn:#f0a541; --ok:#5fd17a; --bad:#ff5f57; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); }
body { font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif; line-height:1.55; }
html:lang(ja) body { font-family:"Segoe UI Variable Display","Segoe UI","Yu Gothic UI","Meiryo","Hiragino Sans",system-ui,sans-serif; }
html:lang(zh-Hans) body { font-family:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif; }
html:lang(zh-Hant) body { font-family:"Segoe UI Variable Display","Segoe UI","Microsoft JhengHei UI","PingFang TC",system-ui,sans-serif; }
html:lang(ko) body { font-family:"Segoe UI Variable Display","Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; word-break:keep-all; }
a { color:var(--accent); text-decoration:none; }
.wrap { max-width:1080px; margin:0 auto; padding:0 16px; }
header { text-align:center; padding:72px 0 28px; }
h1 { font-size:clamp(44px,8vw,88px); line-height:1; margin:0; letter-spacing:-.02em; }
.lede { font-size:clamp(19px,2.6vw,26px); color:var(--muted); margin:16px auto 0; max-width:760px; }
.cta { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:30px 0 8px; }
.btn { display:inline-block; padding:13px 26px; border-radius:999px; font-weight:600; font-size:17px; }
.btn.primary { background:var(--ink); color:var(--bg); }
.film video { background:var(--bg); }
.btn.ghost { border:1px solid var(--line); color:var(--ink); }
.small { color:var(--muted); font-size:14px; }
.film { margin:34px auto 0; border-radius:18px; overflow:hidden; border:1px solid var(--line); background:#000; }
.film video { display:block; width:100%; height:auto; }
.need { margin:44px auto 0; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:14px; padding:18px 22px; }
.need h2 { font-size:19px; margin:0 0 8px; }
.need ul { margin:0; padding-left:20px; }
.need li { margin:4px 0; }
section h2.big { font-size:clamp(30px,4.6vw,46px); text-align:center; margin:84px 0 8px; letter-spacing:-.01em; }
section p.sub { text-align:center; color:var(--muted); margin:0 auto 30px; max-width:640px; font-size:18px; }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
.tile { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.tile img { display:block; width:100%; height:auto; }
.tile div { padding:14px 18px 18px; }
.tile b { font-size:18px; }
.tile span { display:block; color:var(--muted); font-size:15px; margin-top:2px; }
.feats { display:flex; flex-direction:column; gap:56px; margin-top:12px; }
.feat { display:grid; grid-template-columns:1.25fr 1fr; gap:36px; align-items:center; }
.feat:nth-child(even) .media { order:2; }
.feat .media { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.feat > * { min-width:0; }
.feat .media img { display:block; width:100%; max-width:100%; height:auto; }
.feat h3 { font-size:clamp(24px,3vw,32px); margin:0 0 10px; letter-spacing:-.01em; }
.feat p { margin:0 0 10px; color:var(--muted); font-size:17px; }
.feat ul { margin:0; padding-left:20px; color:var(--muted); font-size:16px; }
.feat li { margin:5px 0; }
kbd { font:600 13px/1 "Segoe UI",system-ui,sans-serif; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:2px 6px; background:var(--card); color:var(--ink); }
code { font-size:15px; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:1px 5px; color:var(--ink); }
@media (max-width:720px) { .feat { grid-template-columns:1fr; gap:16px; } .feat:nth-child(even) .media { order:0; } }
.faq { max-width:760px; margin:0 auto; }
.faq h3 { font-size:18px; margin:26px 0 4px; }
.faq p { margin:0; color:var(--muted); }
nav.langs { margin:0 0 14px; line-height:2; }
nav.langs a, nav.langs b { white-space:nowrap; }
footer { text-align:center; color:var(--muted); font-size:13px; padding:70px 0 40px; }
@media (max-width:720px) { .grid { grid-template-columns:1fr; } header { padding-top:48px; } }
</style>
